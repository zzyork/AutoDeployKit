[project]
name = "autodeploykit"
version = "0.1.2"
description = "Interactive SSH automation toolkit for Linux server operations"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "typer~=0.16.0",
    "rich~=14.0.0",
    "paramiko~=3.5.1",
    "colorama~=0.4.6",
    "requests~=2.32.4",
    "packaging~=25.0",
]

[project.scripts]
autodeploykit = "cli:main"
autodeploykit-webui-init = "webui.bootstrap:main"

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "cryptography>=44,<47",
    "fastapi-users[sqlalchemy]>=15.0.5,<16",
    "aiosqlite>=0.20,<1",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "middleware_ops",
    "monitor_ops",
    "server_check",
    "server_ops",
    "software_ops",
    "utils",
    "webui",
]

[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "cli.py"
"config/webui/AGENTS.md" = "webui/install/AGENTS.md"
"config/webui/CLAUDE.md" = "webui/install/CLAUDE.md"

[tool.ruff]
# Public Python standards enforced here:
# - PEP 8: whitespace, imports, naming, and line length
# - PEP 484/526: type-hint friendly code; mypy is the type checker
# - PEP 621: project metadata lives in this pyproject.toml
line-length = 100
target-version = "py39"
src = [
    "middleware_ops",
    "monitor_ops",
    "server_check",
    "server_ops",
    "software_ops",
    "utils",
]
extend-exclude = [".venv", ".mypy_cache", ".ruff_cache"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors, mostly PEP 8
    "W",      # pycodestyle warnings
    "F",      # Pyflakes: undefined names and unused imports
    "I",      # isort-compatible import order
    "N",      # pep8-naming
    "UP",     # pyupgrade: modern Python 3.12 syntax
    "B",      # flake8-bugbear
    "BLE",    # avoid blind broad exceptions unless explicitly justified
    "A",      # avoid shadowing Python builtins
    "C4",     # cleaner comprehensions
    "PIE",    # small Python correctness/style rules
    "RET",    # explicit, simple return flow
    "RSE",    # raise statement correctness
    "PTH",    # prefer pathlib APIs for paths
    "PERF",   # low-risk performance footguns
    "T20",    # no print statements in application code
    "SIM",    # simplify redundant control flow
    "ASYNC",  # async/await correctness
]
ignore = [
    "E501",   # line wrapping is handled by ruff format with line-length = 100
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = [
    "middleware_ops",
    "monitor_ops",
    "server_check",
    "server_ops",
    "software_ops",
    "utils",
    "webui",
]

[tool.ruff.lint.per-file-ignores]
"webui/api.py" = ["B008"]  # FastAPI evaluates Depends when registering routes.
"webui/bootstrap.py" = ["T20"]  # Local interactive command reports initialization status.

[tool.ruff.lint.pydocstyle]
# PEP 257 docstring convention. D rules are not selected yet because the
# current codebase still has many intentional ORM/router docstring gaps.
convention = "pep257"

[tool.mypy]
python_version = "3.9"
strict = true
files = [
    "middleware_ops",
    "monitor_ops",
    "server_check",
    "server_ops",
    "software_ops",
    "utils",
    "cli.py",
]
show_error_codes = true
pretty = true
