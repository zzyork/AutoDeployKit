[project]
name = "keystone-coach-api"
version = "0.1.0"
description = "Keystone Coach backend (Python + FastAPI)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "gql[httpx]>=3.5",
    "openai>=1.60",
    "upstash-redis>=1.2",
    "upstash-ratelimit>=1.1",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
# Public Python standards enforced here:
# - PEP 8: whitespace, imports, naming, and line length
# - PEP 484/526: type-hint friendly code; mypy is the type checker
# - PEP 621: project metadata lives in this pyproject.toml
line-length = 100
target-version = "py312"
src = ["app", "alembic"]
extend-exclude = [".venv", ".mypy_cache", ".ruff_cache"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors, mostly PEP 8
    "W",      # pycodestyle warnings
    "F",      # Pyflakes: undefined names and unused imports
    "I",      # isort-compatible import order
    "N",      # pep8-naming
    "UP",     # pyupgrade: modern Python 3.12 syntax
    "B",      # flake8-bugbear
    "BLE",    # avoid blind broad exceptions unless explicitly justified
    "A",      # avoid shadowing Python builtins
    "C4",     # cleaner comprehensions
    "PIE",    # small Python correctness/style rules
    "RET",    # explicit, simple return flow
    "RSE",    # raise statement correctness
    "PTH",    # prefer pathlib APIs for paths
    "PERF",   # low-risk performance footguns
    "T20",    # no print statements in application code
    "SIM",    # simplify redundant control flow
    "ASYNC",  # async/await correctness
]
ignore = [
    "E501",   # line wrapping is handled by ruff format with line-length = 100
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.pydocstyle]
# PEP 257 docstring convention. D rules are not selected yet because the
# current codebase still has many intentional ORM/router docstring gaps.
convention = "pep257"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "alembic"]
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
