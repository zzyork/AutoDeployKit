services:
  webui:
    image: autodeploykit-webui:${WEBUI_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.webui
    environment:
      WEBUI_SECURE_COOKIES: "1"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "0.0.0.0:${WEBUI_PORT:-8765}:8765"
    volumes:
      - webui_data:/var/lib/autodeploykit
      - webui_key:/etc/autodeploykit:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  init:
    image: autodeploykit-webui:${WEBUI_IMAGE_TAG:-local}
    profiles: [setup]
    read_only: true
    tmpfs:
      - /tmp
    entrypoint: ["autodeploykit-webui-init"]
    command: []
    environment:
      WEBUI_TLS_IP: ${WEBUI_TLS_IP:-127.0.0.1}
    volumes:
      - webui_data:/var/lib/autodeploykit
      - webui_key:/etc/autodeploykit
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  webui_data:
  webui_key:
